
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F.R.I.D.A.Y. Authentication</title>
<style>
body {
  background: #0b1422;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 40px 20px;
}
.container {
  max-width: 420px;
  margin: 50px auto;
  padding: 25px;
  background: #14243a;
  border-radius: 18px;
}
button {
  background: #1687d9;
  color: white;
  border: 0;
  padding: 14px 22px;
  border-radius: 10px;
  font-size: 16px;
  margin: 8px;
}
button:disabled { opacity: .5; }
#status { color: #66d9a7; margin-top: 20px; }
</style>
</head>
<body>
<div class="container">
  <h1>F.R.I.D.A.Y.</h1>
  <p>Secure Puter AI Connection</p>
  <button id="connect" disabled>Loading Puter.js...</button>
  <button id="disconnect" disabled>Sign out</button>
  <p id="status">Loading...</p>
</div>

<script src="https://js.puter.com/v2/"></script>
<script>
const connect = document.getElementById("connect");
const disconnect = document.getElementById("disconnect");
const status = document.getElementById("status");

function updateStatus() {
  try {
    const signedIn = puter.auth.isSignedIn();
    status.textContent = signedIn
      ? "Connected successfully!"
      : "Not connected. Tap Sign in.";
    disconnect.disabled = !signedIn;
  } catch (e) {
    status.textContent = "Status error: " + e.message;
  }
}

connect.addEventListener("click", async () => {
  try {
    status.textContent = "Opening secure sign-in...";
    await puter.auth.signIn();
    updateStatus();
  } catch (e) {
    status.textContent =
      "Sign-in error: " + (e.msg || e.message || e.error);
  }
});

disconnect.addEventListener("click", async () => {
  try {
    await puter.auth.signOut();
    updateStatus();
  } catch (e) {
    status.textContent = "Sign-out error: " + e.message;
  }
});

window.addEventListener("load", () => {
  connect.disabled = false;
  connect.textContent = "Sign in with Puter";
  updateStatus();
});
</script>
</body>
</html>
